name: Release

# A vX.Y.Z tag on master builds, deploys to wordpress.org SVN and creates the
# GitHub release. Pull requests and manual runs only build and check the zip.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: WPUserManager/.github/.github/workflows/deploy.yml@master
    with:
      plugin-slug: instagrate-to-wordpress
      dry-run: ${{ github.event_name != 'push' }}
    # Named, not inherited: inherit doesn't cross from polevaultweb to WPUserManager.
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
